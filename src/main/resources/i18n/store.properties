# Texts of the store slice (docs/architecture/phase-2.md, D4), resolved with com.myagree.app.common.i18n.Messages.
# This English base bundle is also the fallback for every language; store_mr and store_hi translate it. UTF-8.
# Placeholders follow java.text.MessageFormat: a message with arguments writes a literal apostrophe as ''.

# Catalogue and cart
store.depot.none=No agro depot is configured
store.product.not-found=Product {0} not found
store.product.barcode-invalid={0} is not an EAN-13 barcode: 13 digits ending in the check digit
store.product.barcode-unknown=No product has the barcode {0}
store.product.out-of-stock={0} is out of stock right now
store.product.mrp-below-price=The MRP cannot be lower than the selling price
store.cart.item-not-found=Cart item {0} not found
store.cart.empty=Your cart is empty
store.cart.unavailable=These products ran out since you added them: {0}. Remove them to check out.
# The cart bar: the first two products, then how many more ("A + B + 2 more")
store.cart.more=+ {0} more
store.cart.other-shop=Your cart has products from {0}. Empty it to buy from {1}.
store.shop.barcode-taken=Another product already uses barcode {0}
store.shop.not-found=Shop {0} not found

# Orders: {0} order number, {1} total, {2} how it is paid
store.order.not-found=Order {0} not found
store.order.placed=Order #{0} placed • {1} • {2}
store.order.payment.CASH_ON_DELIVERY=Cash on Delivery
store.order.payment.ONLINE=Pay online
store.order.not-payable=This order is not waiting for an online payment
store.order.already-paid=This order is already paid
# What an online payment pays for: {0} order number
store.payment.description=Agro Store order #{0}
