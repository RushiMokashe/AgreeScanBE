# Texts of the payments slice (docs/architecture/phase-2.md, D5), resolved with com.myagree.app.common.i18n.Messages.
# This English base bundle is also the fallback for every language; payment_mr and payment_hi translate it. UTF-8.
# Placeholders follow java.text.MessageFormat: a message with arguments writes a literal apostrophe as ''.

payment.not-found=Payment {0} not found
payment.payable-not-found=There is no such order or booking to pay for
payment.unavailable=Online payment is not available right now. Please pay in cash or try again later.
payment.provider-failed=The payment service did not respond. Please try again in a moment.
payment.simulated-outcome-required=Choose whether the test payment succeeds or fails
payment.razorpay-confirmation-invalid=This payment could not be verified. If money was taken, Razorpay refunds it automatically.
payment.webhook-invalid=The webhook signature is missing or invalid
