notification.BOOKING_STARTED.title=काम सुरू झाले
notification.BOOKING_STARTED.body={0} यांनी {1} सह काम सुरू केले असून ते तुमच्याकडे येत आहेत.

notification.BOOKING_COMPLETED.title=काम पूर्ण झाले
notification.BOOKING_COMPLETED.body={0} यांनी {1} सह काम पूर्ण केले. रक्कम: {2}.

notification.BOOKING_CANCELLED.title=बुकिंग रद्द झाले
