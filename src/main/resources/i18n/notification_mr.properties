# Marathi texts of the notifications slice; see notification.properties. UTF-8.

notification.BOOKING_REQUESTED.title=नवीन बुकिंग विनंती
notification.BOOKING_REQUESTED.body={0} यांना {2} साठी {1} हवे आहे ({3})

notification.BOOKING_ACCEPTED.title=बुकिंग स्वीकारले
notification.BOOKING_ACCEPTED.body={0} यांनी {2} साठीचे तुमचे {1} बुकिंग स्वीकारले आहे.

notification.BOOKING_DECLINED.title=बुकिंग नाकारले
