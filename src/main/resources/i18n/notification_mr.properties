notification.BOOKING_CANCELLED.body.no-reason={0} यांनी {2} साठीचे {1} बुकिंग रद्द केले.

notification.PAYMENT_SUCCEEDED.title=पेमेंट यशस्वी
notification.PAYMENT_SUCCEEDED.body={1} साठी {0} चे पेमेंट यशस्वी झाले.

notification.PAYMENT_FAILED.title=पेमेंट अयशस्वी
notification.PAYMENT_FAILED.body={1} साठी {0} चे पेमेंट झाले नाही: {2}. कोणतीही रक्कम कापली गेली नाही, तुम्ही पुन्हा पेमेंट करू शकता.
notification.PAYMENT_FAILED.body.no-reason={1} साठी {0} चे पेमेंट झाले नाही. कोणतीही रक्कम कापली गेली नाही, तुम्ही पुन्हा पेमेंट करू शकता.

