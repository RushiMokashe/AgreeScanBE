# Texts of the notifications slice (docs/architecture/phase-2.md, D10), resolved with
# com.myagree.app.common.i18n.Messages. This English base bundle is also the fallback for every language;
# notification_mr and notification_hi translate it. UTF-8. Placeholders follow java.text.MessageFormat: a message
# with arguments writes a literal apostrophe as ''.
#
# notification.<TYPE>.title and .body are rendered when a notification is read; their placeholders are the type's
# parameters in order (com.myagree.app.common.spi.NotificationType). Amounts arrive formatted, e.g. "₹1,300".
# A type with a reason uses .body.no-reason when none was given.

# To the owner: {0} farmer, {1} vehicle, {2} slot, {3} amount
notification.BOOKING_REQUESTED.title=New booking request
notification.BOOKING_REQUESTED.body={0} wants {1} for {2} ({3})

# To the farmer: {0} owner, {1} vehicle, {2} slot
notification.BOOKING_ACCEPTED.title=Booking accepted
notification.BOOKING_ACCEPTED.body={0} accepted your booking of {1} for {2}.

# To the farmer: {0} owner, {1} vehicle, {2} reason
notification.BOOKING_DECLINED.title=Booking declined
notification.BOOKING_DECLINED.body={0} declined your booking of {1}: {2}
notification.BOOKING_DECLINED.body.no-reason={0} declined your booking of {1}.

# To the farmer: {0} owner, {1} vehicle
notification.BOOKING_STARTED.title=Job started
notification.BOOKING_STARTED.body={0} has started the job with {1} and is on the way.

# To the farmer: {0} owner, {1} vehicle, {2} amount
notification.BOOKING_COMPLETED.title=Job completed
notification.BOOKING_COMPLETED.body={0} completed the job with {1}. Amount: {2}.

# To the owner: {0} farmer, {1} vehicle, {2} slot, {3} reason
notification.BOOKING_CANCELLED.title=Booking cancelled
notification.BOOKING_CANCELLED.body={0} cancelled the booking of {1} for {2}: {3}
notification.BOOKING_CANCELLED.body.no-reason={0} cancelled the booking of {1} for {2}.

# To the payer, and for a booking also to the owner: {0} amount, {1} what it paid for
notification.PAYMENT_SUCCEEDED.title=Payment successful
notification.PAYMENT_SUCCEEDED.body=The payment of {0} for {1} went through.

# To the payer: {0} amount, {1} what it was for, {2} reason
notification.PAYMENT_FAILED.title=Payment failed
notification.PAYMENT_FAILED.body=The payment of {0} for {1} did not go through: {2}. Nothing was charged, so you can pay again.
notification.PAYMENT_FAILED.body.no-reason=The payment of {0} for {1} did not go through. Nothing was charged, so you can pay again.

# To the shopkeeper or vehicle owner: {0} farmer, {1} amount, {2} what it pays for, {3} UPI reference
notification.PAYMENT_TO_CONFIRM.title=Confirm a Scan & Pay payment
notification.PAYMENT_TO_CONFIRM.body={0} says they paid you {1} for {2} (UPI ref {3}). Check your bank and confirm it.

# To the payer: {0} who it went to, {1} amount, {2} what it was for
notification.PAYMENT_NOT_RECEIVED.title=Payment not received
notification.PAYMENT_NOT_RECEIVED.body={0} did not receive your {1} for {2}: {3}. If money left your account, show them your UPI reference, or pay again.
notification.PAYMENT_NOT_RECEIVED.body.no-reason={0} did not receive your {1} for {2}. If money left your account, show them your UPI reference, or pay again.

# Errors
notification.not-found=Notification {0} not found
notification.stream.unavailable=Live alerts are busy right now. Your notifications will still refresh shortly.
