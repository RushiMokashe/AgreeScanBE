# Texts of the markets & care slice (mandi and agro care) shown to users (docs/architecture/phase-2.md, D4), resolved
# with com.myagree.app.common.i18n.Messages. This English base bundle is also the fallback for every language;
# market_mr and market_hi translate it. UTF-8. Placeholders follow java.text.MessageFormat: a message with arguments
# writes a literal apostrophe as ''.

