# Hindi texts of the payments slice; see payment.properties. UTF-8.

payment.not-found=भुगतान {0} नहीं मिला
payment.payable-not-found=भुगतान के लिए ऐसा कोई ऑर्डर या बुकिंग नहीं है
payment.unavailable=ऑनलाइन भुगतान अभी उपलब्ध नहीं है। कृपया नकद दें या थोड़ी देर बाद फिर से कोशिश करें।
payment.provider-failed=भुगतान सेवा से जवाब नहीं आया। कृपया थोड़ी देर में फिर से कोशिश करें।
payment.simulated-outcome-required=चुनें कि टेस्ट भुगतान सफल हो या विफल
payment.razorpay-confirmation-invalid=इस भुगतान की पुष्टि नहीं हो सकी। अगर पैसे कटे हैं, तो Razorpay उन्हें अपने-आप लौटा देता है।
payment.webhook-invalid=वेबहुक का हस्ताक्षर नहीं है या अमान्य है
payment.scan-and-pay-unavailable=इस विक्रेता ने अभी स्कैन करके भुगतान शुरू नहीं किया है। कृपया कार्ड या UPI से भुगतान करें।
payment.scan-and-pay-pending=आपका स्कैन करके किया गया भुगतान {0} की पुष्टि का इंतज़ार कर रहा है। अगर वे कहें कि पैसे नहीं मिले, तो आप फिर से भुगतान कर सकते हैं।
payment.upi-reference-used=यह UPI संदर्भ पहले ही किसी दूसरे भुगतान में इस्तेमाल हो चुका है। अपने UPI ऐप में 12 अंक जाँचें।
payment.already-decided=इस भुगतान की पहले ही पुष्टि हो चुकी है या इसे नहीं मिला बताया जा चुका है।
