spring.application.name=MyAgreeApp
server.port=8080

# In-memory demo database, rebuilt and re-seeded on every start
spring.datasource.url=jdbc:h2:mem:agriscan;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Safety net against N+1 selects on lazy collections that are not fetched through an entity graph
spring.jpa.properties.hibernate.default_batch_fetch_size=32
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Crop photos uploaded from the scanner
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server-side display texts in English, Marathi and Hindi: one bundle per namespace in src/main/resources/i18n
# (<ns>.properties in English, the fallback, plus <ns>_mr and <ns>_hi). A namespace without files yet is skipped.
spring.messages.basename=i18n/common,i18n/farm,i18n/market,i18n/rental,i18n/store,i18n/payment,i18n/admin,i18n/assistant,i18n/notification
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

agriscan.uploads-dir=${java.io.tmpdir}/agriscan-uploads
agriscan.cors-allowed-origins=http://localhost:5173

# Sign-in. AGRISCAN_JWT_SECRET (at least 32 bytes) signs access tokens and media URLs; when it is unset a random
# secret is generated at startup, so a restart signs everyone out.
agriscan.security.jwt-secret=${AGRISCAN_JWT_SECRET:}
# Send the refresh cookie over HTTPS only; keep false while the app is served from http://localhost
agriscan.security.cookie-secure=false
agriscan.security.access-token-ttl=15m
agriscan.security.refresh-token-ttl=30d

# Online payments: auto (Stripe when its keys are set, else Razorpay, else simulated), stripe, razorpay or simulated
agriscan.payments.provider=${AGRISCAN_PAYMENTS_PROVIDER:auto}
agriscan.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
agriscan.payments.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
agriscan.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
agriscan.payments.razorpay.key-id=${RAZORPAY_KEY_ID:}
agriscan.payments.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
agriscan.payments.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Voice assistant: Claude answers when ANTHROPIC_API_KEY is set, the rule-based engine otherwise or on any error
agriscan.assistant.anthropic.api-key=${ANTHROPIC_API_KEY:}
agriscan.assistant.anthropic.model=claude-opus-5-5
agriscan.assistant.anthropic.timeout=15s
